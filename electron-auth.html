<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — SmartStudyHub</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #121212; color: #e0e0e0; }
    .card { background: #1e1e1e; padding: 2rem; border-radius: 14px; text-align: center; width: 100%; max-width: 400px; border: 1px solid rgba(0, 255, 255, 0.35); box-shadow: 0 0 24px rgba(0, 255, 255, 0.15); box-sizing: border-box; }
    h1 { margin: 0 0 1rem; font-size: 1.35rem; font-weight: 700; text-shadow: 0 0 10px rgba(0, 255, 255, 0.35); }
    p { margin: 0 0 1.5rem; color: #a0a0a0; font-size: 0.9rem; line-height: 1.4; }
    
    .auth-buttons-stack { display: flex; flex-direction: column; gap: 10px; }
    
    button {
      width: 100%;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-family: inherit;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      border: 1px solid #d0d0d0;
      background: #ffffff;
      color: #3c4043;
      box-sizing: border-radius;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22); }
    button:active { transform: translateY(0); }
    
    button.vk {
      background: #ffffff;
      color: #0077FF;
      border: 1px solid rgba(0, 119, 255, 0.4);
    }
    button.vk:hover {
      background: #f4f8ff;
      border-color: #0077FF;
      box-shadow: 0 4px 14px rgba(0, 119, 255, 0.28);
    }
    
    button.google {
      background: #ffffff;
      color: #3c4043;
      border: 1px solid #d0d0d0;
    }
    button.google:hover {
      background: #f8fafd;
      border-color: #4285f4;
      box-shadow: 0 4px 14px rgba(66, 133, 244, 0.28);
    }
    
    button.github {
      background: #ffffff;
      color: #24292e;
      border: 1px solid #d0d0d0;
    }
    button.github:hover {
      background: #f6f8fa;
      border-color: #24292e;
      box-shadow: 0 4px 14px rgba(36, 41, 46, 0.28);
    }
    
    .auth-btn-icon-svg { position: absolute; left: 14px; width: 20px; height: 20px; flex-shrink: 0; }
    .auth-btn-label { display: block; width: 100%; text-align: center; }
    
    button.pulse {
      animation: pulseBtn 1.5s infinite alternate;
    }
    @keyframes pulseBtn {
      from { transform: scale(1); }
      to { transform: scale(1.02); }
    }
    .status { margin-top: 1rem; font-size: 0.85rem; color: #00c853; word-break: break-word; }
    .error { color: #ff5252; }
  </style>
</head>
<body>
  <div class="card">
    <h1>SmartStudyHub</h1>
    <p id="auth-desc">Выберите способ входа для авторизации в приложении.</p>
    <div class="auth-buttons-stack">
      <button id="vk-signin-btn" class="vk" type="button" style="display: none;">
        <svg class="auth-btn-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="#0077FF" d="M15.684 0H8.316C2.692 0 0 2.692 0 8.316v7.368C0 21.308 2.692 24 8.316 24h7.368C21.308 24 24 21.308 24 15.684V8.316C24 2.692 21.308 0 15.684 0zm3.692 17.129h-1.644c-.624 0-.816-.496-1.936-1.616-1.024-1.008-1.472-1.136-1.728-1.136-.368 0-.48.104-.48.608v1.44c0 .4-.128.656-1.184.656-1.744 0-3.68-1.056-5.04-3.024-2.048-2.928-2.608-5.12-2.608-5.568 0-.24.096-.464.56-.464h1.644c.416 0 .576.192.736.64.8 2.32 2.144 4.352 2.688 4.352.208 0 .304-.096.304-.624V9.825c-.064-1.12-.656-1.216-.656-1.616 0-.192.16-.384.416-.384h2.576c.352 0 .48.176.48.592v3.184c0 .352.16.48.272.48.208 0 .384-.128.768-.512 1.184-1.328 2.032-3.376 2.032-3.376.112-.24.288-.384.704-.384h1.644c.496 0 .608.256.496.608-.208.976-2.256 3.872-2.256 3.872-.192.304-.272.448 0 .8.192.256.848.832 1.28 1.328.784.896 1.392 1.648 1.552 2.176.176.496-.08.752-.576.752z"/></svg>
        <span class="auth-btn-label">Войти через VK ID</span>
      </button>
      <button id="signin-btn" class="google" type="button">
        <svg class="auth-btn-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        <span class="auth-btn-label">Sign in with Google</span>
      </button>
      <button id="github-signin-btn" class="github" type="button">
        <svg class="auth-btn-icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        <span class="auth-btn-label">Sign in with GitHub</span>
      </button>
    </div>
    <div id="status" class="status"></div>
  </div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDSgNxVrCXDGIrA-yZzAAYuWKtC13BmJLY",
      authDomain: "studio-9933447149-80d6a.firebaseapp.com",
      databaseURL: "https://studio-9933447149-80d6a-default-rtdb.firebaseio.com",
      projectId: "studio-9933447149-80d6a",
      storageBucket: "studio-9933447149-80d6a.firebasestorage.app",
      messagingSenderId: "121615915195",
      appId: "1:121615915195:web:f2eb26c4c23530ef8e719e",
      measurementId: "G-F02D7YK7S3"
    };
    firebase.initializeApp(firebaseConfig);

    const DEEP_LINK = 'smartstudyhub://auth';
    const params = new URLSearchParams(window.location.search);
    const requestedProvider = (params.get('provider') || 'google').toLowerCase();

    const statusEl = document.getElementById('status');
    const btn = document.getElementById('signin-btn');
    const githubBtn = document.getElementById('github-signin-btn');
    const vkBtn = document.getElementById('vk-signin-btn');
    const descEl = document.getElementById('auth-desc');

    if (requestedProvider === 'vk' || requestedProvider === 'oidc.vk-id') {
      vkBtn.classList.add('pulse');
      descEl.textContent = 'Нажмите «Войти через VK ID» для завершения входа в приложение.';
    } else if (requestedProvider === 'github') {
      githubBtn.classList.add('pulse');
      descEl.textContent = 'Click "Sign in with GitHub" to link your account to the desktop app.';
    } else {
      btn.classList.add('pulse');
      descEl.textContent = 'Click "Sign in with Google" to link your account to the desktop app.';
    }

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (isError ? ' error' : '');
    }

    function openInApp(token, provider, googleAccessToken) {
      let url = DEEP_LINK
        + '?token=' + encodeURIComponent(token)
        + '&provider=' + encodeURIComponent(provider);
      if (googleAccessToken) {
        url += '&googleAccessToken=' + encodeURIComponent(googleAccessToken);
      }
      window.location.href = url;
      setStatus('Opening SmartStudyHub app… You can close this tab.');
    }

    function tokenFromResult(result, provider) {
      if (!result) return Promise.reject(new Error('No result returned from auth'));
      const cred = result.credential;
      const prov = provider || (cred && cred.providerId && cred.providerId.includes('vk') ? 'vk' : cred && cred.providerId && cred.providerId.includes('github') ? 'github' : 'google');
      if ((prov === 'vk' || prov === 'oidc.vk-id') && cred && cred.accessToken) {
        return Promise.resolve({ token: cred.accessToken, provider: 'vk' });
      }
      if (prov === 'github' && cred && cred.accessToken) {
        return Promise.resolve({ token: cred.accessToken, provider: 'github' });
      }
      if (prov === 'google' && cred && cred.idToken) {
        return Promise.resolve({ token: cred.idToken, provider: 'google', googleAccessToken: cred.accessToken });
      }
      if (result.user) {
        return result.user.getIdToken().then((token) => ({ token, provider: prov }));
      }
      return Promise.reject(new Error('Failed to retrieve user token'));
    }

    firebase.auth().getRedirectResult()
      .then((result) => {
        if (result && result.user) {
          setStatus('Authentication successful! Opening app…');
          return tokenFromResult(result).then(({ token, provider, googleAccessToken }) => {
            openInApp(token, provider, googleAccessToken);
          });
        }
      })
      .catch((err) => {
        console.error('Redirect auth error:', err);
        setStatus(err.message || 'Redirect authentication failed.', true);
      });

    function runSignIn(providerName) {
      setStatus('Signing in…');
      btn.disabled = true;
      githubBtn.disabled = true;
      vkBtn.disabled = true;
      btn.classList.remove('pulse');
      githubBtn.classList.remove('pulse');
      vkBtn.classList.remove('pulse');

      let provider;
      if (providerName === 'vk' || providerName === 'oidc.vk-id') {
        provider = new firebase.auth.OAuthProvider('oidc.vk-id');
      } else if (providerName === 'github') {
        provider = new firebase.auth.GithubAuthProvider();
      } else {
        provider = new firebase.auth.GoogleAuthProvider();
        provider.addScope('https://www.googleapis.com/auth/calendar');
        provider.addScope('https://www.googleapis.com/auth/tasks');
        provider.addScope('https://www.googleapis.com/auth/youtube.readonly');
        provider.addScope('https://www.googleapis.com/auth/gmail.modify');
        provider.addScope('https://www.googleapis.com/auth/drive.file');
        provider.addScope('https://www.googleapis.com/auth/documents');
      }

      firebase.auth().signInWithPopup(provider)
        .then((result) => tokenFromResult(result, providerName))
        .then(({ token, provider, googleAccessToken }) => {
          setStatus('Success! Opening app…');
          openInApp(token, provider, googleAccessToken);
        })
        .catch((err) => {
          console.warn('Popup sign-in warning:', err);
          if (err.code === 'auth/popup-blocked' || err.code === 'auth/popup-closed-by-user') {
            setStatus('Popup blocked or closed. Switching to secure redirect…');
            firebase.auth().signInWithRedirect(provider);
          } else {
            setStatus(err.message || 'Sign-in failed.', true);
            btn.disabled = false;
            githubBtn.disabled = false;
            vkBtn.disabled = false;
          }
        });
    }

    vkBtn.addEventListener('click', () => runSignIn('vk'));
    btn.addEventListener('click', () => runSignIn('google'));
    githubBtn.addEventListener('click', () => runSignIn('github'));
  </script>
</body>
</html>
