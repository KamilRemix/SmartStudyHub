name: Build & Release (Android APK + Windows EXE)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.4.0)'
        required: false
        default: 'v1.4.0'
      publish_release:
        description: 'Publish release to GitHub Releases page'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: "Build Android APK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Install Mobile Dependencies
        run: |
          cd mobile-expo
          npm ci || npm install

      - name: Setup Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > mobile-expo/android/app/smartstudyhub-release.keystore
            echo "Loaded keystore from secret"
          else
            echo "Using committed smartstudyhub-release.keystore"
          fi
          ls -la mobile-expo/android/app/smartstudyhub-release.keystore

      - name: Build Android Release APK
        run: |
          cd mobile-expo/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify Signed APK
        run: |
          APK_PATH=$(find mobile-expo/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            $APKSIGNER verify --verbose "$APK_PATH" || true
          fi

      - name: Rename APK
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
            TAG="v1.4.0"
          fi
          APK_PATH=$(find mobile-expo/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" "SmartStudyHub-${TAG}.apk"
          echo "Created SmartStudyHub-${TAG}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartStudyHub-Android-APK
          path: SmartStudyHub-*.apk

      - name: Publish APK to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: "SmartStudyHub ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: SmartStudyHub-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-exe:
    name: "Build Windows EXE"
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build:web
        env:
          REACT_APP_GEMINI_API_KEY: ${{ secrets.REACT_APP_GEMINI_API_KEY }}

      - name: Build Windows Executable (NSIS)
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH: never

      - name: Rename EXE
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.tag }}") {
            $tag = "${{ inputs.tag }}"
          }
          if (-not $tag -or $tag -eq "main" -or $tag -eq "master") {
            $tag = "v1.4.0"
          }
          $exe = Get-ChildItem -Path dist-exe -Filter '*.exe' | Select-Object -First 1
          if ($exe) {
            $newName = "SmartStudyHub-Setup-${tag}.exe"
            Copy-Item $exe.FullName -Destination $newName
            Write-Host "Renamed to $newName"
          } else {
            Write-Error "No .exe found in dist-exe/"
            exit 1
          }

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartStudyHub-Windows-EXE
          path: SmartStudyHub-Setup-*.exe

      - name: Publish EXE to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: "SmartStudyHub ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: SmartStudyHub-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
