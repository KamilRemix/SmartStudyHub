name: Build Android APK (SmartStudyHub)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-expo-apk:
    name: "Build Expo Android Release APK (SmartStudyHub)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Install Mobile Dependencies
        run: |
          cd mobile-expo
          npm ci || npm install

      - name: Setup Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > mobile-expo/android/app/smartstudyhub-release.keystore
            echo "Loaded keystore from secret"
          else
            echo "Using committed smartstudyhub-release.keystore"
          fi
          ls -la mobile-expo/android/app/smartstudyhub-release.keystore

      - name: Build Android Release APK
        env:
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.REACT_APP_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          REACT_APP_GEMINI_API_KEY: ${{ secrets.REACT_APP_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          cd mobile-expo/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=768m" -Dkotlin.daemon.jvm.options="-Xmx1024m"

      - name: Verify Signed APK
        run: |
          APK_PATH=$(find mobile-expo/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            $APKSIGNER verify --verbose "$APK_PATH" || true
          fi

      - name: Prepare APK Output (SmartStudyHub.apk)
        run: |
          APK_PATH=$(find mobile-expo/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_PATH" "SmartStudyHub.apk"
          ls -lh SmartStudyHub.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartStudyHub
          path: SmartStudyHub.apk
          retention-days: 14
