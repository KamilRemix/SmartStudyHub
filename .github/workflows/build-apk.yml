name: Build Android APK (SmartStudyHub)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-apk:
    name: "Build Android APK (SmartStudyHub)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Install Root Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Assets & Sync Capacitor
        env:
          REACT_APP_GEMINI_API_KEY: ${{ secrets.REACT_APP_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          node build-web.js
          npx @capacitor/cli sync android

      - name: Build Capacitor APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output (SmartStudyHub.apk)
        run: |
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" "SmartStudyHub.apk"
          ls -lh SmartStudyHub.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartStudyHub
          path: SmartStudyHub.apk
          retention-days: 14
