name: Build Android APK & Windows Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Assets
        run: npm run build:web
        env:
          REACT_APP_GEMINI_API_KEY: ${{ secrets.REACT_APP_GEMINI_API_KEY }}

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SmartStudyHub-v1.1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: SmartStudyHub-Android-APK
          path: SmartStudyHub-v1.1.0.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: SmartStudyHub v1.1.0 (Android APK & Web Release)
          body: |
            🎉 **SmartStudyHub v1.1.0 Release**
            - 📱 **Android APK**: Download `SmartStudyHub-v1.1.0.apk` directly below!
            - 🎨 Updated icon across desktop, web & Android.
            - 📱 Fixed mobile GPA calculator layout responsiveness.
            - 🔐 Added GitHub Sign-In support.
          files: SmartStudyHub-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
